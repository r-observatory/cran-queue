name: Update CRAN Queue

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cran-queue-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true

      - name: Install dependencies
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::RSQLite
            any::DBI
            any::jsonlite
            any::testthat

      - name: Run unit tests
        run: Rscript tests/testthat.R

      - name: Download previous database
        # queue.db is carried forward in the release asset, so this download IS
        # the pipeline's state. Treating every failure here as "no previous
        # release" once cost four months of snapshots: on 2026-07-16 the API
        # answered 503, the run started from an empty file, re-seeded the
        # historical backfill and published that as the new latest.
        #
        # So resolve the tag first and let the two cases diverge. A repo with no
        # releases genuinely starts fresh; a repo that HAS a release must come
        # back with that release's asset or fail loudly, because publishing
        # without it silently discards everything collected so far.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="$(gh release view --json tagName -q .tagName 2>/dev/null || true)"
          if [ -z "$tag" ]; then
            echo "No releases exist yet; starting fresh."
            exit 0
          fi
          echo "Previous release: $tag"

          # A missing asset and a failed download look the same to `gh release
          # download`, so ask the release what it actually carries before trying
          # to pull anything. Otherwise a compressed-only release and a network
          # failure would be indistinguishable, which is the confusion that
          # caused the 07-16 loss in the first place.
          assets="$(gh release view "$tag" --json assets -q '.assets[].name' 2>/dev/null || true)"
          if printf '%s\n' "$assets" | grep -qx 'queue.db.zst'; then
            want="queue.db.zst"
          elif printf '%s\n' "$assets" | grep -qx 'queue.db'; then
            want="queue.db"
          else
            echo "::error::${tag} carries neither queue.db.zst nor queue.db (assets: ${assets:-none}). Refusing to start from an empty database."
            exit 1
          fi
          echo "Pulling $want"

          for attempt in 1 2 3 4 5; do
            if gh release download "$tag" --pattern "$want" --clobber; then
              downloaded=1
              [ "$attempt" -gt 1 ] && echo "downloaded ${want} (attempt $attempt)"
              break
            fi
            echo "attempt ${attempt}/5 failed to download ${want} from ${tag}"
            [ "$attempt" -lt 5 ] && sleep $((attempt * 10))
          done
          if [ "${downloaded:-0}" != "1" ]; then
            echo "::error::${tag} exists but its ${want} could not be downloaded. Refusing to start from an empty database, which would discard the accumulated snapshots."
            exit 1
          fi

          if [ "$want" = "queue.db.zst" ]; then
            command -v zstd >/dev/null || { echo "::error::zstd not found on the runner"; exit 1; }
            zstd -dq -f queue.db.zst -o queue.db \
              || { echo "::error::${tag}'s queue.db.zst could not be decompressed"; exit 1; }
            rm -f queue.db.zst
          fi
          # An empty or truncated file would reach import-history.R as a fresh
          # database and re-bootstrap just as a failed download does.
          if [ ! -s queue.db ]; then
            echo "::error::downloaded queue.db from ${tag} is empty"
            exit 1
          fi
          # The manifest states what that release contained, and update.R holds
          # this run to it before publishing. Releases predating the manifest do
          # not have one, so its absence is not an error; a run with nothing to
          # compare against says so and carries on.
          gh release download "$tag" --pattern "manifest.json" --clobber \
            || echo "::warning::${tag} has no manifest.json; this run cannot be checked against it"

      - name: Import historical data (if needed)
        run: Rscript scripts/import-history.R queue.db

      - name: Run update script
        run: Rscript scripts/update.R queue.db

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v$(date -u +'%Y%m%d-%H%M%S')"
          # Both assets for now. Consumers still pulling queue.db keep working
          # while they move to queue.db.zst, which is the one that has room to
          # grow; the plain copy comes out once nothing reads it.
          gh release create "$TAG" \
            queue.db \
            queue.db.zst \
            manifest.json \
            --title "Queue snapshot $TAG" \
            --notes-file release_notes.md \
            --latest

      - name: Update last run timestamp
        continue-on-error: true
        run: |
          echo "Last updated: $(date -u +'%Y-%m-%d %H:%M:%S UTC')" > last-updated.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add last-updated.txt
          git diff --cached --quiet || git commit -m "chore: update last run time"
          git pull --rebase || true
          git push
