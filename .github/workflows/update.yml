name: Update CRAN Queue

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cran-queue-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true

      - name: Install dependencies
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::RSQLite
            any::DBI
            any::jsonlite
            any::testthat

      - name: Run unit tests
        run: Rscript tests/testthat.R

      - name: Download previous database
        # queue.db is carried forward in the releases, so this download IS the
        # pipeline's state: the full history, put back together from this
        # year's part and the history-YYYY releases its manifest lists. Any
        # failure stops the run rather than starting from an empty file (see
        # the script for the two times that cost the history).
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/download-prior.sh

      - name: Import historical data (if needed)
        run: Rscript scripts/import-history.R queue.db

      - name: Run update script
        run: Rscript scripts/update.R queue.db

      - name: Create release
        # Any closed year without a history-YYYY release gets one first; then
        # this run's release, which stays Latest.
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/publish.sh

      - name: Update last run timestamp
        continue-on-error: true
        run: |
          echo "Last updated: $(date -u +'%Y-%m-%d %H:%M:%S UTC')" > last-updated.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add last-updated.txt
          git diff --cached --quiet || git commit -m "chore: update last run time"
          git pull --rebase || true
          git push
