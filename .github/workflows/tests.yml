name: Tests

# The hourly update workflow runs the suite too, but it only runs on a schedule,
# so until a change is already on main nothing has exercised it. A failing test
# there does not just report a problem, it stops that run before the scrape and
# the queue loses the hour. Run the same suite on the pull request instead, where
# a failure costs nothing.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true

      # Same set the update workflow installs, so a package that is available
      # there and missing here cannot make the two disagree.
      - name: Install dependencies
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::RSQLite
            any::DBI
            any::jsonlite
            any::testthat

      - name: Run unit tests
        run: Rscript tests/testthat.R
